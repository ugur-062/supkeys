packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Sentry kaynak haritası yükleyicisi (binary indirir). 2026-09-16: bu izin
  # `package.json` `pnpm.onlyBuiltDependencies`e yazılmıştı; o alan BU LİSTENİN
  # YERİNE geçip Prisma'yı dışarıda bıraktı → Vercel derlemesi
  # "@prisma/client has no exported member PrismaClient" ile düştü. İzinler
  # TEK YERDE, burada tutulur.
  '@sentry/cli': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
