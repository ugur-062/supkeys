<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rothern</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: #fff; color: #0a0a0a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      }
      main { max-width: 340px; text-align: center; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.5; color: #525252; margin: 0 0 24px; }
      button {
        appearance: none; border: 0; border-radius: 10px; padding: 12px 20px; width: 100%;
        font-size: 15px; font-weight: 600; color: #fff; background: #1e89df;
      }
      button:active { background: #0d77cc; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Sayfa şu anda yüklenemiyor</h1>
      <p id="body">Sunucuya ulaşılamadı. Lütfen tekrar deneyin.</p>
      <button id="retry" type="button">Tekrar dene</button>
    </main>
    <script>
      // Bu sayfa cihazda durur; site dili okunamadığı için cihaz diline bakılır.
      var TEXT = {
        en: ["This page can't be loaded right now", "The server couldn't be reached. Please try again.", "Try again"],
        ru: ["Страница сейчас не загружается", "Не удалось связаться с сервером. Попробуйте ещё раз.", "Повторить"],
      };
      var lang = (navigator.language || "tr").slice(0, 2).toLowerCase();
      var t = TEXT[lang];
      if (t) {
        document.documentElement.lang = lang;
        document.getElementById("title").textContent = t[0];
        document.getElementById("body").textContent = t[1];
        document.getElementById("retry").textContent = t[2];
      }
      // capacitor.config.ts içindeki `server.url` + `appStartPath` ile aynı olmalı.
      var START_URL = "https://www.rothern.com/company";
      document.getElementById("retry").addEventListener("click", function () {
        window.location.replace(START_URL);
      });
    </script>
  </body>
</html>
