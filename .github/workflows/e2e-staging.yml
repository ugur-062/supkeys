# Staging uçtan uca testleri — GECELİK + elle tetiklenir.
#
# Neden ayrı iş akışı: bu testler CANLI staging'e (Vercel + Render + Supabase)
# konuşur, her PR'da koşarsa hem yavaşlar hem de gerçek veriye yazar. Gecelik
# koşum "dün gece hâlâ çalışıyor muydu" sorusunu yanıtlar — sürüklenme sessizce
# birikmesin.
#
# Ayrıca TARAYICI MATRİSİ burada: WebKit (Safari motoru) yerel makinede 216
# sistem paketi istiyor, GitHub runner'ında `--with-deps` ile kurulabiliyor.
name: E2E (staging)

on:
  schedule:
    - cron: "0 1 * * *" # her gece 04:00 TR (01:00 UTC)
  workflow_dispatch:
    inputs:
      project:
        description: "Playwright projesi (chromium | webkit-kritik | mobil-safari)"
        required: false
        default: "chromium"

concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  e2e:
    name: Staging e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Sırlar tanımlı değilse iş SESSİZCE yeşil görünmesin diye önce kontrol edilir.
    steps:
      - name: Sır kontrolü
        env:
          BYPASS: ${{ secrets.STAGING_VERCEL_BYPASS_WEB }}
        run: |
          if [ -z "$BYPASS" ]; then
            echo "::error::STAGING_VERCEL_BYPASS_WEB tanımlı değil — depo ayarlarından ekleyin (docs/release-process.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma istemcisi (e2e veritabanı yardımcıları için)
        run: pnpm exec prisma generate
        working-directory: packages/db

      - name: Tarayıcıları kur
        run: pnpm exec playwright install --with-deps ${{ github.event.inputs.project == 'chromium' && 'chromium' || 'chromium webkit' }}
        working-directory: apps/web

      - name: Testler
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: https://staging.rothern.com
          PLAYWRIGHT_ADMIN_URL: https://admin.staging.rothern.com
          E2E_API_URL: https://api.staging.rothern.com/api
          PLAYWRIGHT_VERCEL_BYPASS: ${{ secrets.STAGING_VERCEL_BYPASS_WEB }}
          PLAYWRIGHT_VERCEL_BYPASS_ADMIN: ${{ secrets.STAGING_VERCEL_BYPASS_ADMIN }}
          E2E_EMAIL: uguray156+qa-alici-kurucu@gmail.com
          E2E_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD }}
          E2E_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          E2E_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          E2E_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          E2E_SUPABASE_SERVICE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pnpm exec playwright test \
            --project="${{ github.event.inputs.project || 'chromium' }}" \
            --reporter=line,html

      - name: Safari motoru (gecelik ek koşum)
        if: github.event_name == 'schedule'
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: https://staging.rothern.com
          E2E_API_URL: https://api.staging.rothern.com/api
          PLAYWRIGHT_VERCEL_BYPASS: ${{ secrets.STAGING_VERCEL_BYPASS_WEB }}
          E2E_EMAIL: uguray156+qa-alici-kurucu@gmail.com
          E2E_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD }}
        run: pnpm exec playwright test --project=webkit-kritik --project=mobil-safari --reporter=line

      - name: Rapor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-raporu
          path: apps/web/playwright-report
          retention-days: 7
