name: Test

on:
  # Lokal full-suite yeşil (74 suite / 788 test, 0 deadlock) → push trigger AÇIK.
  # Testler lokal Postgres service container'a koşar (aşağıda), remote Supabase'e
  # DEĞİL; deadlock fix connection_limit=1 kodda (ortamdan bağımsız aktif).
  # KADEMELİ: önce push; ilk koşu yeşil teyit edilince pull_request de açılacak.
  push:
    branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

# Çakışan pipeline'ları iptal et — sadece son commit kalır
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (api + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Supabase 17.6 paritesi (docker-compose.test.yml ile aynı).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rothern
          POSTGRES_PASSWORD: rothern_test_password
          POSTGRES_DB: rothern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rothern"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test DB — service container'a doğrudan bağlantı
      DATABASE_URL: "postgresql://rothern:rothern_test_password@localhost:5432/rothern_test?schema=public"
      POSTGRES_USER: rothern
      POSTGRES_PASSWORD: rothern_test_password
      POSTGRES_DB: rothern_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      NODE_ENV: test
      # JWT_SECRET test fixture — gerçek production secret değil
      JWT_SECRET: "ci_test_jwt_secret_only_for_pipeline_runs_64_chars_minimum_xxxxx"
      JWT_EXPIRES_IN: "1h"
      EMAIL_PROVIDER: mailpit
      RESEND_WEBHOOK_SECRET: ""
      ALLOW_INSECURE_WEBHOOK: "true"
      CORS_ORIGINS: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: packages/db
        run: pnpm exec prisma generate

      # Migration'lar test başında jest globalSetup ile `rothern_test` şemasına
      # uygulanır (migrate deploy) — testlerin kullandığı şema. Ayrı public-şema
      # migrate adımı gereksizdi (yanlış hedef) → kaldırıldı.

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Run tests with coverage
        run: pnpm --filter @rothern/api test:cov
        env:
          # apps/api/.env.test test runner'a yüklenir, ama burada da garanti
          DATABASE_URL: "postgresql://rothern:rothern_test_password@localhost:5432/rothern_test?schema=public"

      - name: Upload coverage report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 7

      - name: Coverage summary (job log)
        if: always()
        run: |
          if [ -f apps/api/coverage/coverage-summary.json ]; then
            echo "## 📊 Coverage Summary" >> $GITHUB_STEP_SUMMARY
            node -e "
              const c = require('./apps/api/coverage/coverage-summary.json').total;
              const pct = (m) => m.pct.toFixed(2);
              console.log('| Metric | Covered | Total | % |');
              console.log('|---|---|---|---|');
              console.log(\`| Statements | \${c.statements.covered} | \${c.statements.total} | \${pct(c.statements)} |\`);
              console.log(\`| Branches | \${c.branches.covered} | \${c.branches.total} | \${pct(c.branches)} |\`);
              console.log(\`| Functions | \${c.functions.covered} | \${c.functions.total} | \${pct(c.functions)} |\`);
              console.log(\`| Lines | \${c.lines.covered} | \${c.lines.total} | \${pct(c.lines)} |\`);
            " >> $GITHUB_STEP_SUMMARY
          fi
