name: Test

on:
  # Full-suite lokal + CI'da yeşil (74 suite / 788 test, 0 deadlock). Testler lokal
  # Postgres service container'a koşar (aşağıda), remote Supabase'e DEĞİL; deadlock
  # fix connection_limit=1 kodda (ortamdan bağımsız aktif). Doc-only değişiklik CI
  # yakmaz (paths-ignore, billing — private repo).
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Çakışan pipeline'ları iptal et — sadece son commit kalır
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (api + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 45  # lint + 3 app build + ön yüz testleri eklendi (P11 #8)

    services:
      # Supabase 17.6 paritesi (docker-compose.test.yml ile aynı).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rothern
          POSTGRES_PASSWORD: rothern_test_password
          POSTGRES_DB: rothern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rothern"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test DB — service container'a doğrudan bağlantı
      DATABASE_URL: "postgresql://rothern:rothern_test_password@localhost:5432/rothern_test?schema=public"
      POSTGRES_USER: rothern
      POSTGRES_PASSWORD: rothern_test_password
      POSTGRES_DB: rothern_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      NODE_ENV: test
      # JWT_SECRET test fixture — gerçek production secret değil
      JWT_SECRET: "ci_test_jwt_secret_only_for_pipeline_runs_64_chars_minimum_xxxxx"
      JWT_EXPIRES_IN: "1h"
      EMAIL_PROVIDER: mailpit
      RESEND_WEBHOOK_SECRET: ""
      ALLOW_INSECURE_WEBHOOK: "true"
      CORS_ORIGINS: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: packages/db
        run: pnpm exec prisma generate

      # Migration'lar test başında jest globalSetup ile `rothern_test` şemasına
      # uygulanır (migrate deploy) — testlerin kullandığı şema. Ayrı public-şema
      # migrate adımı gereksizdi (yanlış hedef) → kaldırıldı.

      - name: Typecheck (all packages)
        run: pnpm typecheck

      # Denetim 2026-08-27 Parça 11 #8: CI yalnız typecheck + api testleri
      # koşuyordu. Ön yüz (web 57 + admin 15 test dosyası) HİÇ koşmuyor, üç
      # app HİÇ build edilmiyordu — yani `next build` sırasında patlayan ya da
      # yalnız ön yüz testinin yakaladığı regresyonlar CI'dan sessizce geçip
      # doğrudan Vercel'e gidiyordu (ör. CSP nonce için zorunlu force-dynamic
      # kaldırılırsa girişin komple kırıldığı bir sürüm yayınlanabilir).
      - name: Lint
        run: pnpm lint

      # migrate diff BOŞ bir gölge DB ister — service container'da yalnız
      # rothern_test var, onu kullanamayız (dolu).
      - name: Gölge veritabanı oluştur
        run: PGPASSWORD=rothern_test_password psql -h localhost -U rothern -d postgres -c 'CREATE DATABASE rothern_shadow;'

      - name: Şema drift kapısı (migrations ≡ schema.prisma)
        working-directory: packages/db
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://rothern:rothern_test_password@localhost:5432/rothern_shadow" \
            --exit-code

      - name: Ön yüz testleri (web + admin)
        run: |
          pnpm --filter @rothern/web test
          pnpm --filter @rothern/admin test

      - name: Build (tüm uygulamalar)
        run: pnpm build
        env:
          # NEXT_PUBLIC_* derleme zamanında gömülür; build'in geçmesi için
          # yer tutucu yeter (yayınlanan değerler Vercel proje env'inden gelir).
          NEXT_PUBLIC_API_URL: "https://api.example.test"
          NEXT_PUBLIC_SITE_URL: "https://www.example.test"

      # push (main'e her commit): düz test — coverage ~%20 yavaş, ara commit'te
      # gereksiz. Kalite kapısı (coverage + artifact + özet) yalnız pull_request'te.
      - name: Run tests (push — coverage yok, hızlı)
        if: github.event_name == 'push'
        run: pnpm --filter @rothern/api test
        env:
          # apps/api/.env.test test runner'a yüklenir, ama burada da garanti
          DATABASE_URL: "postgresql://rothern:rothern_test_password@localhost:5432/rothern_test?schema=public"

      - name: Run tests with coverage (pull_request / manuel)
        if: github.event_name != 'push'
        run: pnpm --filter @rothern/api test:cov
        env:
          DATABASE_URL: "postgresql://rothern:rothern_test_password@localhost:5432/rothern_test?schema=public"

      - name: Upload coverage report (artifact)
        if: ${{ always() && github.event_name != 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 7

      - name: Coverage summary (job log)
        if: ${{ always() && github.event_name != 'push' }}
        run: |
          if [ -f apps/api/coverage/coverage-summary.json ]; then
            echo "## 📊 Coverage Summary" >> $GITHUB_STEP_SUMMARY
            node -e "
              const c = require('./apps/api/coverage/coverage-summary.json').total;
              const pct = (m) => m.pct.toFixed(2);
              console.log('| Metric | Covered | Total | % |');
              console.log('|---|---|---|---|');
              console.log(\`| Statements | \${c.statements.covered} | \${c.statements.total} | \${pct(c.statements)} |\`);
              console.log(\`| Branches | \${c.branches.covered} | \${c.branches.total} | \${pct(c.branches)} |\`);
              console.log(\`| Functions | \${c.functions.covered} | \${c.functions.total} | \${pct(c.functions)} |\`);
              console.log(\`| Lines | \${c.lines.covered} | \${c.lines.total} | \${pct(c.lines)} |\`);
            " >> $GITHUB_STEP_SUMMARY
          fi
